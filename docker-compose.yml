services:
  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped

  web:
    build: .
    command: uvicorn app.web:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "8090:8000"
    restart: unless-stopped
